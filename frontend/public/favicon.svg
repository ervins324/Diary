<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="diaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background rounded squircle / book base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#diaryGrad)" filter="url(#dropShadow)" />

  <!-- Spine accent line -->
  <rect x="76" y="72" width="24" height="368" rx="12" fill="#4338CA" opacity="0.45" />

  <!-- Open Book / Diary Pages Symbol -->
  <g transform="translate(96, 116)">
    <!-- Left Page -->
    <path d="M 160 250 C 90 220, 20 226, 8 230 L 8 40 C 24 36, 88 30, 160 62 Z" fill="url(#pageGrad)" />
    <!-- Right Page -->
    <path d="M 160 250 C 230 220, 300 226, 312 230 L 312 40 C 296 36, 232 30, 160 62 Z" fill="#FFFFFF" />

    <!-- Center Spine Crease -->
    <line x1="160" y1="58" x2="160" y2="252" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" />

    <!-- Ruled lines on Left Page (timetable & homework) -->
    <line x1="44" y1="86" x2="132" y2="76" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="44" y1="124" x2="132" y2="114" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="44" y1="162" x2="132" y2="152" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="44" y1="200" x2="112" y2="190" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.45" />

    <!-- Bookmark Ribbon hanging out -->
    <path d="M 160 58 L 160 170 L 176 154 L 192 170 L 192 63 Z" fill="#F59E0B" />

    <!-- Ruled lines on Right Page -->
    <line x1="188" y1="92" x2="276" y2="102" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="188" y1="130" x2="276" y2="140" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="188" y1="168" x2="276" y2="178" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <line x1="188" y1="206" x2="256" y2="214" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" opacity="0.45" />

    <!-- Checkmark icon on right page indicating completed homework -->
    <circle cx="242" cy="186" r="18" fill="#10B981" />
    <path d="M 233 186 L 239 192 L 251 180" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
